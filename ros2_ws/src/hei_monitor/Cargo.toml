[package]
name = "hei_monitor"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "monitor"
path = "src/main.rs"

[dependencies]
rclrs = "=0.7.0"
sensor_msgs = "*"
nav_msgs = "*"
diagnostic_msgs = "*"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
serde_json = "1"
bytes = "1"
fs2 = "0.4"

[package.metadata.ros]
install_to_share = ["README.md"]
