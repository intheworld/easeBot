# Same USB-CAN bus, independently claimed by the gripper controller.
# Raw motor resource, not an uncalibrated prismatic finger joint.
gripper:
  name: left_gripper_motor
  motor_id: 7
  feedback_id: 23
  model: DM4310
  control_mode: torque_pos
  direction: 1
  offset: 0.0
  gear_ratio: 1.0
  p_max: 12.5
  v_max: 30.0
  t_max: 10.0
  velocity_limit: 10.0
  current_ratio_limit: 0.05
  # DM-J4310-2EC V1.1: rated output 3 Nm, peak 7 Nm.
  # Project feedback trip threshold uses the rated value; t_max is protocol range.
  torque_limit_nm: 3.0
  minimum: -4.5
  maximum: 0.0
