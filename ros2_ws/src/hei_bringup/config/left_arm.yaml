# Reference wiring/protocol values from hei-rebot-lift; confirm calibration and firmware ranges before motion.
port: /dev/hei_left_arm
baud: 921600
feedback_timeout_ms: 250
configure_timeout_ms: 2000
motors:
- name: b_left_joint1
  motor_id: 1
  feedback_id: 17
  model: DM4340
  direction: 1
  offset: 0.0
  gear_ratio: 1.0
  p_max: 12.5
  v_max: 10.0
  t_max: 28.0
  velocity_limit: 0.1
  minimum: -1.5
  maximum: 0.3
